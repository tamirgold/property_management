nameOverride: ""
fullnameOverride: ""

image:
  repository: change-me.azurecr.io/property-management
  tag: latest
  pullPolicy: IfNotPresent

replicaCount:
  web: 2
  telegram: 1

serviceAccount:
  create: true
  name: ""

workloadIdentity:
  enabled: true
  clientId: ""
  tenantId: ""

keyVault:
  name: ""
  secretProviderClassName: property-management-spc
  objects:
    - envName: OPENAI_API_KEY
      secretName: openai-api-key
    - envName: TELEGRAM_BOT_TOKEN
      secretName: telegram-bot-token
    - envName: TELEGRAM_ALLOWED_USER_IDS
      secretName: telegram-allowed-user-ids
    - envName: TELEGRAM_ALLOWED_GROUP_IDS
      secretName: telegram-allowed-group-ids
    - envName: PLATFORM_OWNER_PASSWORD
      secretName: platform-owner-password
    - envName: PLATFORM_ENCRYPTION_KEY
      secretName: platform-encryption-key
    - envName: ERPNEXT_API_KEY
      secretName: erpnext-api-key
    - envName: ERPNEXT_API_SECRET
      secretName: erpnext-api-secret
    - envName: WEBHOOK_SECRET
      secretName: webhook-secret
    - envName: STRIPE_SECRET_KEY
      secretName: stripe-secret-key
    - envName: STRIPE_PUBLISHABLE_KEY
      secretName: stripe-publishable-key
    - envName: STRIPE_WEBHOOK_SECRET
      secretName: stripe-webhook-secret
    - envName: TWILIO_ACCOUNT_SID
      secretName: twilio-account-sid
    - envName: TWILIO_AUTH_TOKEN
      secretName: twilio-auth-token
    - envName: TWILIO_FROM_NUMBER
      secretName: twilio-from-number
    - envName: BOLDSIGN_API_KEY
      secretName: boldsign-api-key
    - envName: BOLDSIGN_WEBHOOK_SECRET
      secretName: boldsign-webhook-secret
    - envName: SMARTMOVE_API_KEY
      secretName: smartmove-api-key
    - envName: DATABASE_URL
      secretName: database-url

config:
  WEBHOOK_PORT: "3000"
  OPENAI_MODEL: "gpt-4o"
  LOG_LEVEL: "info"
  PLATFORM_MULTI_TENANT: "1"
  DEFAULT_TENANT_SLUG: "legacy-default"
  DEFAULT_TENANT_NAME: "Legacy Default Company"
  DEFAULT_TENANT_TIMEZONE: "America/Los_Angeles"
  DEFAULT_TENANT_LOCALE: "en-US"
  DEFAULT_TENANT_CURRENCY: "USD"
  PLATFORM_OWNER_EMAIL: ""
  REPORT_DELIVERY: "telegram"
  WEBHOOK_BASE_URL: ""
  ERPNEXT_BASE_URL: ""
  LANDLORD_NAME: ""
  LANDLORD_EMAIL: ""
  LANDLORD_PHONE: ""
  LANDLORD_ADDRESS: ""
  BOLDSIGN_TEMPLATE_OH_LEASE: ""
  BOLDSIGN_TEMPLATE_OH_RENEWAL: ""
  BOLDSIGN_TEMPLATE_NC_LEASE: ""
  BOLDSIGN_TEMPLATE_NC_RENEWAL: ""

resources:
  web:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  telegram:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  jobs:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: property-management-tls

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

cronJobs:
  timezone: America/Los_Angeles
  jobs:
    - id: overdue_rent
      enabled: true
      schedule: "0 8 * * *"
    - id: lease_renewal
      enabled: true
      schedule: "0 10 * * *"
    - id: late_fees
      enabled: true
      schedule: "30 10 * * *"
    - id: stale_work_orders
      enabled: true
      schedule: "0 9 * * *"
    - id: weekly_report
      enabled: true
      schedule: "0 17 * * 5"
