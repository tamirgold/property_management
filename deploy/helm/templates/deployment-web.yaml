apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "property-management.fullname" . }}-web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "property-management.name" . }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "property-management.name" . }}
        app.kubernetes.io/component: web
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "property-management.serviceAccountName" . }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_MODE
              value: web
          envFrom:
            - configMapRef:
                name: {{ include "property-management.fullname" . }}-config
            - secretRef:
                name: {{ include "property-management.fullname" . }}-secrets
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /webhooks/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /webhooks/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources.web | indent 12 }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.keyVault.secretProviderClassName }}
