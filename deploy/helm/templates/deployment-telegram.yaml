apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "property-management.fullname" . }}-telegram
spec:
  replicas: {{ .Values.replicaCount.telegram }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "property-management.name" . }}
      app.kubernetes.io/component: telegram
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "property-management.name" . }}
        app.kubernetes.io/component: telegram
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "property-management.serviceAccountName" . }}
      containers:
        - name: telegram
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_MODE
              value: telegram
          envFrom:
            - configMapRef:
                name: {{ include "property-management.fullname" . }}-config
            - secretRef:
                name: {{ include "property-management.fullname" . }}-secrets
          resources:
{{ toYaml .Values.resources.telegram | indent 12 }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.keyVault.secretProviderClassName }}
