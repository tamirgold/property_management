{{- range .Values.cronJobs.jobs }}
{{- if .enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "property-management.fullname" $ }}-{{ .id }}
spec:
  schedule: {{ .schedule | quote }}
  timeZone: {{ $.Values.cronJobs.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "property-management.name" $ }}
            app.kubernetes.io/component: job
            azure.workload.identity/use: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "property-management.serviceAccountName" $ }}
          containers:
            - name: {{ .id }}
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              env:
                - name: APP_MODE
                  value: job
                - name: JOB_ID
                  value: {{ .id | quote }}
              envFrom:
                - configMapRef:
                    name: {{ include "property-management.fullname" $ }}-config
                - secretRef:
                    name: {{ include "property-management.fullname" $ }}-secrets
              resources:
{{ toYaml $.Values.resources.jobs | indent 16 }}
              volumeMounts:
                - name: secrets-store
                  mountPath: /mnt/secrets-store
                  readOnly: true
          volumes:
            - name: secrets-store
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: {{ $.Values.keyVault.secretProviderClassName }}
---
{{- end }}
{{- end }}
