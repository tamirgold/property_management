name: CD

on:
  push:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  CHART_PATH: deploy/helm
  RELEASE_NAME: property-management
  ACR_NAME: ${{ vars.ACR_NAME || 'pmbetterdealacr' }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'pmbetterdealacr.azurecr.io' }}
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP || 'pm-betterdeal-rg' }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME || 'pm-betterdeal-aks' }}
  KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME || 'pmbetterdeal-kv' }}
  WORKLOAD_IDENTITY_CLIENT_ID: ${{ vars.WORKLOAD_IDENTITY_CLIENT_ID || '5a849235-8999-45d3-b969-2878707b17aa' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'production' }}
  K8S_SERVICE_ACCOUNT_NAME: ${{ vars.K8S_SERVICE_ACCOUNT_NAME || 'property-management-sa' }}
  APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://pm.betterdeal.ai' }}

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Azure auth mode
        id: azure-auth
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [[ -n "${AZURE_CLIENT_ID}" && -n "${AZURE_TENANT_ID}" && -n "${AZURE_SUBSCRIPTION_ID}" ]]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=creds" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        if: ${{ steps.azure-auth.outputs.mode == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (creds fallback)
        if: ${{ steps.azure-auth.outputs.mode == 'creds' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name "${{ env.ACR_NAME }}"

      - name: Build and push image
        id: meta
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/property-management:${IMAGE_TAG}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy-prod:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Azure auth mode
        id: azure-auth
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [[ -n "${AZURE_CLIENT_ID}" && -n "${AZURE_TENANT_ID}" && -n "${AZURE_SUBSCRIPTION_ID}" ]]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=creds" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        if: ${{ steps.azure-auth.outputs.mode == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (creds fallback)
        if: ${{ steps.azure-auth.outputs.mode == 'creds' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "${{ env.AKS_RESOURCE_GROUP }}" --name "${{ env.AKS_CLUSTER_NAME }}" --overwrite-existing

      - name: Create namespace
        run: kubectl create namespace "${{ env.K8S_NAMESPACE }}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if compgen -G "db/migrations/*.sql" > /dev/null; then
            docker run --rm \
              -e DATABASE_URL="${DATABASE_URL}" \
              -v "${PWD}/db/migrations:/migrations:ro" \
              postgres:16 \
              sh -c 'for f in $(ls /migrations/*.sql | sort); do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done'
          else
            echo "No db/migrations/*.sql files found, skipping."
          fi

      - name: Helm deploy
        run: |
          helm upgrade --install "${RELEASE_NAME}" "${CHART_PATH}" \
            --namespace "${{ env.K8S_NAMESPACE }}" \
            -f "${CHART_PATH}/values.yaml" \
            -f "${CHART_PATH}/values-prod.yaml" \
            --set image.repository="${{ env.ACR_LOGIN_SERVER }}/property-management" \
            --set image.tag="${{ needs.build-and-push.outputs.image_tag }}" \
            --set serviceAccount.name="${{ env.K8S_SERVICE_ACCOUNT_NAME }}" \
            --set workloadIdentity.clientId="${{ env.WORKLOAD_IDENTITY_CLIENT_ID }}" \
            --set workloadIdentity.tenantId="${{ secrets.AZURE_TENANT_ID }}" \
            --set keyVault.name="${{ env.KEY_VAULT_NAME }}"

      - name: Wait for web rollout
        run: kubectl rollout status deployment/property-management-property-management-web -n "${{ env.K8S_NAMESPACE }}" --timeout=10m

      - name: Reset stale ACME resources
        run: |
          OBJECTS="$(kubectl get certificaterequest,order,challenge -n "${{ env.K8S_NAMESPACE }}" -o name | grep -E '^(certificaterequest\.cert-manager\.io|order\.acme\.cert-manager\.io|challenge\.acme\.cert-manager\.io)/property-management-tls-' || true)"
          if [[ -n "${OBJECTS}" ]]; then
            echo "${OBJECTS}" | xargs kubectl delete -n "${{ env.K8S_NAMESPACE }}"
          fi

      - name: Wait for Let's Encrypt certificate
        run: kubectl wait --for=condition=Ready certificate/property-management-tls -n "${{ env.K8S_NAMESPACE }}" --timeout=15m

      - name: Public smoke test
        run: curl --retry 12 --retry-delay 10 --retry-connrefused -fsS "${{ env.APP_BASE_URL }}/webhooks/health"
